name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild so the freshness ages never lag the calendar by more than
  # about a week when nothing is pushed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A run in progress finishes; the next one queues
# behind it rather than cancelling a production deploy halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The same tests, validation and page checks as a pull request runs, with
  # full git history, and the built site uploaded as the Pages artifact.
  build:
    uses: ./.github/workflows/ci.yml
    with:
      upload-dist: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
