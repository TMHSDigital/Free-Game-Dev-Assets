name: Validate catalog

# No path filters: the build reads catalog/, stacks/, docs/, site/ and the
# top-level Markdown files, and the whole run takes seconds.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test catalog checks
        run: node site/checks.test.mjs
      - name: Test site build modules
        run: node site/lib/lib.test.mjs

      - name: Validate catalog
        run: node site/validate.mjs
      - name: Build site and check pages
        run: node site/build.mjs
