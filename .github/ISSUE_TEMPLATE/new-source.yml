name: New source
description: Suggest a free, commercially usable asset library, pack, or tool
title: "[source] "
labels: ["new-source"]
body:
  - type: markdown
    attributes:
      value: |
        Check [CONTRIBUTING.md](https://github.com/TMHSDigital/Free-Game-Dev-Assets/blob/main/CONTRIBUTING.md) and search the [catalog](https://tmhsdigital.github.io/Free-Game-Dev-Assets/) first. Duplicates and paid-only marketplaces will be closed.
  - type: input
    id: name
    attributes:
      label: Name
      placeholder: Kenney, Poly Haven, Lucide, …
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Publisher URL
      description: Primary source page, not a mirror or aggregator listing.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - 3d
        - 2d
        - characters
        - audio
        - animation
        - video
        - environment
        - shaders-vfx
        - fonts
        - tools
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License as stated on the live page
      description: Quote the short name (CC0, CC-BY-4.0, SIL OFL, custom, …). Do not guess.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Licence quote and date
      description: Copy the sentence from the live licence page that grants the use, and the date you read it. This becomes the entry's Evidence line.
      placeholder: |
        Live licence page (2026-10-23): "All assets are released under CC0 1.0 and may be used in commercial projects."
    validations:
      required: true
  - type: dropdown
    id: commercial
    attributes:
      label: Commercial / game use
      options:
        - Explicitly allowed
        - Explicitly forbidden
        - Unclear / per-file
        - Video/YouTube only (not games)
    validations:
      required: true
  - type: dropdown
    id: attribution
    attributes:
      label: Credit required?
      options:
        - "Yes"
        - "No"
        - Credit appreciated but not required
        - Unclear
    validations:
      required: true
  - type: input
    id: attribution_string
    attributes:
      label: Credit line as the source words it
      description: Only if the source gives one. Leave it empty rather than writing your own.
  - type: checkboxes
    id: publisher
    attributes:
      label: Relationship to the source
      options:
        - label: I publish or maintain this source (see CONTRIBUTING, "Submitting your own source")
  - type: textarea
    id: notes
    attributes:
      label: Why it belongs
      description: What production need it closes, and any license traps you already spotted.
